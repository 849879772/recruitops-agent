[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recruitops-agent"
version = "0.1.2"
description = "Local-first recruitment intelligence and application operations agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=2,<3",
  "pgvector>=0.3,<1",
  "pyyaml>=6.0,<7",
  "pypdf>=5,<7",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<51",
  "playwright==1.58.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
