<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>RecruitOps Desktop Preview</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="brand">RecruitOps <small>桌面预览</small></div><button id="home">启动状态</button><button id="workbench">工作台</button><div id="tabs" role="tablist"></div><button id="hide" title="最小化到托盘">收起</button><button id="quit">退出</button></header>
<nav><button id="back" title="后退" aria-label="后退">←</button><button id="forward" title="前进" aria-label="前进">→</button><button id="reload" title="刷新" aria-label="刷新">↻</button><form id="address-form"><input id="address" type="url" required placeholder="https:// 招聘官网地址" aria-label="招聘官网地址"><button type="submit">打开官网</button></form><button id="filler-open" disabled>简历闪填</button><button id="capture">采集草稿</button><button id="clear-site">清除此站登录</button><span id="loading"></span></nav>
<div id="recruitment-surface" hidden aria-label="官网区域"></div>
<aside id="filler-panel" hidden aria-label="简历闪填预览" data-target-width="420">
  <div class="filler-heading"><h2>简历闪填</h2><button id="filler-close" title="收起侧栏" aria-label="收起侧栏">›</button></div>
  <p id="filler-target" class="filler-muted"></p>
  <div class="filler-tabs" role="tablist" aria-label="闪填功能">
    <button id="filler-tab-scan" role="tab" aria-controls="filler-view-scan" aria-selected="true" tabindex="0">扫描与填写</button>
    <button id="filler-tab-profile" role="tab" aria-controls="filler-view-profile" aria-selected="false" tabindex="-1">简历资料</button>
    <button id="filler-tab-applications" role="tab" aria-controls="filler-view-applications" aria-selected="false" tabindex="-1">投递记录</button>
  </div>
  <p id="filler-status" role="status" aria-live="polite"></p><p id="filler-ui-error" class="error" role="alert" hidden></p>
  <div class="filler-scroll">
    <div id="filler-view-scan" role="tabpanel" aria-labelledby="filler-tab-scan">
      <button id="filler-one-click" class="filler-primary" disabled>一键填写</button>
      <p id="filler-one-click-feedback" role="status" aria-live="polite" hidden></p>
      <div class="filler-actions"><button id="filler-undo" disabled>撤销本次填写</button><button id="filler-stop" disabled title="停止后续填写；已填写内容保留，不会刷新官网">停止</button></div>
      <div id="filler-upload-row" class="filler-actions" hidden><select id="filler-upload-target" aria-label="简历附件目标"></select><button id="filler-attachment-upload" disabled>上传默认简历</button></div>
      <p id="filler-plan-note" role="status"></p>
      <details id="filler-advanced"><summary>未完成字段与高级选项</summary>
      <div id="filler-remaining" hidden></div>
      <p id="filler-frame-note" class="filler-muted"></p>
      <div class="filler-actions"><button id="filler-scan">扫描当前页面</button><button id="filler-prepare" disabled>同步重复经历</button></div>
      <button id="filler-frame-allow" type="button" hidden disabled>允许扫描嵌入表单</button>
      <label class="filler-check"><input id="filler-select-all" type="checkbox" disabled>全选可填字段</label><p id="filler-counts" class="filler-muted"></p>
      <div id="filler-fields"></div><p id="filler-empty">尚未扫描当前页面。</p>
      <button id="filler-confirm" class="filler-primary" disabled>确认填写所选字段</button>
      <p id="filler-fill-feedback" class="filler-muted" hidden></p><button id="filler-retry-failed" disabled hidden>重新扫描失败字段</button>
      <details id="filler-custom"><summary>自定义补充答案</summary>
        <label>目标字段<select id="filler-custom-field"><option value="">仅保存答案</option></select></label>
        <label>问题<input id="filler-custom-question" maxlength="500" autocomplete="off"></label>
        <label>答案<textarea id="filler-custom-answer" rows="3" maxlength="10000"></textarea></label>
        <label>适用范围<select id="filler-custom-scope"><option value="site">仅当前网站</option><option value="global">所有网站</option></select></label>
        <p id="filler-custom-origin" class="filler-muted"></p><button id="filler-custom-save" disabled>保存自定义答案</button>
        <div id="filler-custom-answers" aria-label="已保存自定义答案"></div>
      </details>
      </details>
    </div>
    <div id="filler-view-profile" role="tabpanel" aria-labelledby="filler-tab-profile" hidden>
      <div class="filler-actions"><button id="filler-profile-import" disabled>导入 JSON</button><button id="filler-profile-export" disabled>导出 JSON</button></div>
      <p id="filler-profile-status" role="status"></p>
      <section class="filler-section"><h3>个人资料</h3>
        <div class="filler-actions"><select id="filler-profile-select" aria-label="切换个人资料" disabled></select><button id="filler-profile-create" disabled>新建空白资料</button></div>
        <label>资料名称<input id="filler-profile-name" maxlength="80" autocomplete="off"></label>
        <div class="filler-actions"><button id="filler-profile-rename" disabled>重命名所选资料</button><button id="filler-profile-delete" disabled>删除所选资料</button></div>
        <label class="filler-check"><input id="filler-profile-delete-confirm" type="checkbox" disabled>确认删除所选资料及其附件</label>
      </section>
      <div class="filler-actions"><button id="filler-demo-enable" disabled>切换演示资料</button><button id="filler-demo-restore" disabled>恢复个人资料</button></div>
      <div id="filler-profile-editor"></div>
      <div class="filler-actions"><button id="filler-profile-save" class="filler-primary" disabled>保存资料</button><button id="filler-profile-discard" disabled>放弃未保存改动</button></div>
      <section class="filler-section"><h3>默认简历附件</h3><p id="filler-attachment-status">未选择附件</p><div class="filler-actions"><button id="filler-attachment-select" disabled>选择或替换附件</button><button id="filler-attachment-clear" disabled>清除附件</button></div><p class="filler-muted">选择附件不代表上传。上传需单独确认，已上传到网站的文件不能通过本地撤销收回。</p></section>
    </div>
    <div id="filler-view-applications" role="tabpanel" aria-labelledby="filler-tab-applications" hidden>
      <div class="filler-actions"><button id="filler-application-detect" disabled>识别当前页面</button></div>
      <p id="filler-application-message" role="status"></p>
      <div id="filler-candidate-toolbar" hidden><label class="filler-check"><input id="filler-candidate-all" type="checkbox">全选</label><span id="filler-candidate-count"></span></div>
      <div id="filler-candidates"></div>
      <label>公司<input id="filler-application-company" maxlength="255"></label><label id="filler-application-title-label">岗位<input id="filler-application-title" maxlength="512"></label>
      <label>投递进度链接<input id="filler-application-url" type="url" maxlength="2048" placeholder="https://"></label><label>城市<input id="filler-application-city" maxlength="255"></label>
      <label class="filler-check"><input id="filler-application-confirm" type="checkbox">已核对当前页面、公司、岗位和进度链接</label>
      <button id="filler-application-save" class="filler-primary" disabled>确认新增登记</button>
      <section class="filler-section"><h3>待补传记录 <span id="filler-queue-count">0</span></h3><p class="filler-muted">仅补传已确认的新增登记。</p><div id="filler-queue"></div><button id="filler-application-flush" disabled>重试全部待补传记录</button></section>
    </div>
  </div>
  <div class="filler-footer">不处理验证码、密码或最终提交。</div>
  <button id="filler-plugin" hidden>选择本地插件目录</button><button id="filler-profile" hidden>导入旧版资料</button>
</aside>
<main id="home-page" hidden><div class="eyebrow">LOCAL DESKTOP / PREVIEW</div><h1>RecruitOps 工作台</h1><section class="status"><h2>连接状态</h2><dl><div><dt>桌面窗口</dt><dd class="ready">已就绪</dd></div><div><dt>独立招聘浏览器</dt><dd class="ready">已就绪</dd></div><div><dt>隔离 API</dt><dd id="api-status">未配置</dd></div><div><dt>实例</dt><dd id="runtime-instance">未创建</dd></div><div><dt>后台解析适配器</dt><dd id="browser-status">待集成</dd></div><div><dt>业务写入</dt><dd id="writes-status">关闭</dd></div></dl></section><p id="configuration-error" class="error"></p></main><aside id="notice" role="status"></aside><script src="shell.js"></script>
<section id="workbench-progress" role="status" aria-live="polite"><h2>正在准备工作台</h2><p id="startup-message">正在启动本地服务，就绪后自动进入。</p></section>
<section id="startup-error" role="alert" hidden><h2>工作台暂时无法打开</h2><p id="startup-error-message"></p><button id="startup-diagnostics">查看启动状态</button></section>
<button id="runtime-writes" hidden disabled>恢复正常业务模式</button><pre id="capture-result" hidden></pre><button id="use-capture" hidden>在手动表单中使用草稿</button></body></html>
