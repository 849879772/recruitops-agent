<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign in</title>
  </head>
  <body>
    <main data-recruitops-auth="login">
      <h1>Sign in to view your applications</h1>
      <form>
        <label>User name <input autocomplete="username" type="text"></label>
        <label>Password <input autocomplete="current-password" type="password"></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
